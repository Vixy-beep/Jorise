<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jorise v2 Enterprise Security Suite{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        .main-content {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .security-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .security-card:hover {
            transform: translateY(-5px);
        }
        .navbar-brand {
            font-weight: bold;
            color: #fff !important;
            font-size: 1.5rem;
        }
        .threat-indicator {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .module-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Advanced Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar p-3">
                <div class="navbar-brand mb-4">
                    <i class="fas fa-shield-virus me-2"></i>
                    <span>Jorise v2</span>
                    <small class="d-block text-light opacity-75">Enterprise Suite</small>
                </div>
                
                <!-- Security Modules Navigation -->
                <div class="mb-4">
                    <h6 class="text-light opacity-75 mb-3">SECURITY MODULES</h6>
                    <nav class="nav flex-column">
                        <a class="nav-link text-white mb-2 d-flex align-items-center" href="/">
                            <i class="fas fa-tachometer-alt me-2"></i>
                            <span>Security Dashboard</span>
                        </a>
                        <a class="nav-link text-white mb-2 d-flex align-items-center" href="/scan/">
                            <i class="fas fa-search me-2"></i>
                            <span>Advanced Scan</span>
                        </a>
                        <a class="nav-link text-white mb-2 d-flex align-items-center" href="/incidents/">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <span>Incident Response</span>
                        </a>
                        <a class="nav-link text-white mb-2 d-flex align-items-center" href="/compliance/">
                            <i class="fas fa-clipboard-check me-2"></i>
                            <span>Compliance</span>
                        </a>
                    </nav>
                </div>

                <!-- Enterprise Modules -->
                <div class="mb-4">
                    <h6 class="text-light opacity-75 mb-3">ENTERPRISE</h6>
                    <nav class="nav flex-column">
                        <a class="nav-link text-white-50 mb-1" href="#"><i class="fas fa-chart-line me-2"></i>SIEM</a>
                        <a class="nav-link text-white-50 mb-1" href="#"><i class="fas fa-desktop me-2"></i>EDR</a>
                        <a class="nav-link text-white-50 mb-1" href="#"><i class="fas fa-shield-alt me-2"></i>WAF</a>
                        <a class="nav-link text-white-50 mb-1" href="#"><i class="fas fa-virus-slash me-2"></i>Antivirus</a>
                        <a class="nav-link text-white-50 mb-1" href="#"><i class="fas fa-cube me-2"></i>Sandbox</a>
                    </nav>
                </div>

                <!-- System Status -->
                <div class="mt-auto">
                    <div class="card bg-transparent border-light">
                        <div class="card-body p-2">
                            <small class="text-light">System Status</small>
                            <div class="d-flex align-items-center">
                                <span class="badge bg-success threat-indicator me-2">●</span>
                                <small class="text-light">All Systems Operational</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 main-content p-4">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
